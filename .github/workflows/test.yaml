# .github/workflows/ test
name: tests
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main
      - master
permissions: write-all
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps :
      - name: Checkout repository
        uses: actions/checkout@v3

#      - name: Set up Docker Buildx
#        uses: docker/setup--buildx-action@v2

      - name: test
        run: python tests/test.py


